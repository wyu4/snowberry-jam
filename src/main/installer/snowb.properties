# jpackage additional launcher: <install dir>\snowb.exe, the Snowberry Jam terminal client.
# The patched main.wxs adds the install dir to PATH so `snowb` works from any terminal.
main-class=com.wyu4.snowberryjam.cli.Snowb
description=Snowberry Jam terminal client
win-console=true
win-shortcut=false
win-menu=false
